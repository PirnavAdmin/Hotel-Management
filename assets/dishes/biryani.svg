<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="100%" stop-color="#0f0e0c"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="rice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="30%" stop-color="#fde68a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="steam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="245" rx="140" ry="25" fill="#000000" opacity="0.6"/>
  <!-- Handi / Bowl -->
  <path d="M 80 180 Q 200 280 320 180 L 305 160 Q 200 240 95 160 Z" fill="url(#bowl)"/>
  <ellipse cx="200" cy="165" rx="110" ry="25" fill="#92400e"/>
  <!-- Dum Biryani Mound -->
  <ellipse cx="200" cy="155" rx="100" ry="45" fill="url(#rice)"/>
  <path d="M 110 155 Q 200 90 290 155 Q 200 170 110 155 Z" fill="#fbbf24"/>
  <!-- Rice grains & saffron layers -->
  <path d="M 130 145 Q 200 115 270 145" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 145 130 Q 200 105 255 130" stroke="#fef08a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Fried onions (birista) -->
  <path d="M 160 120 Q 175 118 190 122" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 210 125 Q 225 120 240 128" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 175 135 Q 195 130 215 138" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Mint / Coriander garnish -->
  <circle cx="195" cy="115" r="7" fill="#16a34a"/>
  <circle cx="205" cy="112" r="8" fill="#22c55e"/>
  <circle cx="202" cy="122" r="6" fill="#15803d"/>
  <!-- Boiled Egg slice / Chicken Piece -->
  <ellipse cx="160" cy="140" rx="14" ry="10" fill="#fef08a" transform="rotate(-15 160 140)"/>
  <ellipse cx="160" cy="140" rx="8" ry="6" fill="#f59e0b" transform="rotate(-15 160 140)"/>
  <!-- Steam curls -->
  <path d="M 180 90 Q 175 70 185 50" stroke="url(#steam)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 205 85 Q 215 65 205 45" stroke="url(#steam)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 225 95 Q 230 75 220 55" stroke="url(#steam)" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
