  <circle cx="185" cy="125" r="3.5" fill="#ffffff"/>
  <circle cx="215" cy="160" r="3" fill="#ffffff"/>
  <circle cx="195" cy="180" r="3" fill="#ffffff"/>
  <circle cx="160" cy="130" r="4" fill="#15803d"/>
  <circle cx="220" cy="135" r="4.5" fill="#16a34a"/>
  <circle cx="180" cy="165" r="4" fill="#15803d"/>
