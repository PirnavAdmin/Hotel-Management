<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>(() => {
      const root = document.documentElement;
      const presets = { orange: "#f59e0b", blue: "#3b82f6", purple: "#a855f7", green: "#22c55e", red: "#ef4444", teal: "#14b8a6", pink: "#ec4899", indigo: "#6366f1" };
      let theme = "light-bistro";
      let accent = "#f59e0b";
      try {
        const savedTheme = localStorage.getItem("gourmet_pos_theme_v2");
        if (savedTheme === "royal-saffron" || savedTheme === "dark") theme = "royal-saffron";
        else if (savedTheme === "light-bistro" || savedTheme === "light") theme = "light-bistro";
        const savedAccent = localStorage.getItem("gourmet_pos_accent_v1");
        accent = /^#[\da-f]{6}$/i.test(savedAccent || "") ? savedAccent.toLowerCase() : (presets[savedAccent] || accent);
      } catch {}
      const channels = accent.match(/[\da-f]{2}/gi).map((part) => parseInt(part, 16));
      const active = channels;
      const end = channels.map((part) => Math.round(part * 0.82));
      const toHex = (parts) => `#${parts.map((part) => part.toString(16).padStart(2, "0")).join("")}`;
      const hsl = (() => {
        const [r, g, b] = channels.map((part) => part / 255);
        const max = Math.max(r, g, b), min = Math.min(r, g, b), delta = max - min;
        let h = 0;
        const l = (max + min) / 2;
        const s = delta === 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
        if (delta) {
          if (max === r) h = ((g - b) / delta) % 6;
          else if (max === g) h = (b - r) / delta + 2;
          else h = (r - g) / delta + 4;
          h = (h * 60 + 360) % 360;
        }
        return [h, s * 100, l * 100];
      })();
      const hslHex = (h, s, l) => {
        s /= 100; l /= 100;
        const k = (n) => (n + h / 30) % 12;
        const a = s * Math.min(l, 1 - l);
        const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        return toHex([f(0), f(8), f(4)].map((v) => Math.round(v * 255)));
      };
      const activeHex = toHex(active);
      root.dataset.accent = accent;
      root.dataset.theme = theme;
      root.style.colorScheme = theme === "light-bistro" ? "light" : "dark";
      root.style.setProperty("--accent-primary", accent);
      root.style.setProperty("--accent-active", activeHex);
      root.style.setProperty("--accent-light", hslHex(hsl[0], hsl[1], Math.min(94, hsl[2] + 24)));
      root.style.setProperty("--accent-dark", hslHex(hsl[0], hsl[1], Math.max(18, hsl[2] - 24)));
      root.style.setProperty("--accent-hover", hslHex(hsl[0], hsl[1], Math.max(18, hsl[2] - (theme === "light-bistro" ? 8 : 10))));
      root.style.setProperty("--accent-secondary", hslHex((hsl[0] + 24) % 360, hsl[1], hsl[2]));
      root.style.setProperty("--accent-gradient-start", activeHex);
      root.style.setProperty("--accent-gradient-end", toHex(end));
      root.style.setProperty("--accent-active-border", `${activeHex}b3`);
      root.style.setProperty("--accent-active-glow", `${accent}59`);
      root.style.setProperty("--accent-rgb", active.join(", "));
      const luminance = channels.map((part) => part / 255).map((part) => part <= 0.04045 ? part / 12.92 : ((part + 0.055) / 1.055) ** 2.4).reduce((sum, part, index) => sum + part * [0.2126, 0.7152, 0.0722][index], 0);
      const darkLuminance = [15, 23, 42].map((part) => part / 255).map((part) => part <= 0.04045 ? part / 12.92 : ((part + 0.055) / 1.055) ** 2.4).reduce((sum, part, index) => sum + part * [0.2126, 0.7152, 0.0722][index], 0);
      root.style.setProperty("--accent-on", (luminance + 0.05) / (darkLuminance + 0.05) >= 1.05 / (luminance + 0.05) ? "#0f172a" : "#ffffff");
    })();</script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f59e0b'><path d='M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-8.03c2.09-.13 3.75-1.85 3.75-3.97V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Management system</title>
    <link rel="stylesheet" href="/fonts/fonts.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
