services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST};Port=${DB_PORT:-3306};Database=${DB_NAME};User=${DB_USER};Password=${DB_PASSWORD};CharSet=utf8mb4;"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-HMS}
      Jwt__Audience: ${JWT_AUDIENCE:-HMS-POS}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      SmtpSettings__Host: ${SMTP_HOST:-smtp.gmail.com}
      SmtpSettings__Port: ${SMTP_PORT:-587}
      SmtpSettings__Username: ${SMTP_USER:-}
      SmtpSettings__Password: ${SMTP_PASS:?Set SMTP_PASS in the root .env file}
      SmtpSettings__FromEmail: ${SMTP_FROM_EMAIL:-}
      SmtpSettings__FromName: ${SMTP_FROM_NAME:-Bhanu Bistro}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./Frontend 
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
