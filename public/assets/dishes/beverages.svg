<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_bev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1824"/>
      <stop offset="100%" stop-color="#09050d"/>
    </linearGradient>
    <linearGradient id="drink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_bev)"/>
  <ellipse cx="200" cy="255" rx="75" ry="16" fill="#000000" opacity="0.6"/>
  <!-- Tall Drink / Lassi Glass (Tapered) -->
  <polygon points="150,90 250,90 230,245 170,245" fill="url(#glass)"/>
  <polygon points="152,110 248,110 228,242 172,242" fill="url(#drink)"/>
  <!-- Ice Cubes inside -->
  <rect x="180" y="125" width="26" height="26" rx="5" fill="#ffffff" opacity="0.4" transform="rotate(15 180 125)"/>
  <rect x="195" y="165" width="24" height="24" rx="5" fill="#ffffff" opacity="0.35" transform="rotate(-20 195 165)"/>
  <!-- Creamy Malai Top / Foam -->
  <ellipse cx="200" cy="110" rx="48" ry="12" fill="#fffbeb"/>
  <!-- Saffron Strands & Pistachios on top -->
  <line x1="185" y1="108" x2="198" y2="112" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="205" y1="106" x2="218" y2="114" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="192" cy="112" r="3" fill="#15803d"/>
  <circle cx="212" cy="110" r="3" fill="#16a34a"/>
  <!-- Straw -->
  <line x1="210" y1="210" x2="245" y2="40" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
  <line x1="245" y1="40" x2="265" y2="35" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
  <!-- Mint Garnish on rim -->
  <ellipse cx="150" cy="85" rx="14" ry="7" fill="#16a34a" transform="rotate(-30 150 85)"/>
  <ellipse cx="145" cy="95" rx="12" ry="6" fill="#22c55e" transform="rotate(20 145 95)"/>
  <!-- Lemon Wheel on Rim -->
  <circle cx="250" cy="88" r="18" fill="#facc15" stroke="#ca8a04" stroke-width="2.5"/>
  <circle cx="250" cy="88" r="14" fill="#fef08a"/>
</svg>
