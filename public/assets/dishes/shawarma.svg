<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_shw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="pita" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="40%" stop-color="#fbd38d"/>
      <stop offset="80%" stop-color="#f6ad55"/>
      <stop offset="100%" stop-color="#dd6b20"/>
    </linearGradient>
    <linearGradient id="foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_shw)"/>
  <ellipse cx="200" cy="245" rx="130" ry="20" fill="#000000" opacity="0.6"/>
  <!-- Foil Wrapping at bottom -->
  <path d="M 120 160 L 280 160 L 250 250 L 150 250 Z" fill="url(#foil)"/>
  <path d="M 120 160 Q 200 175 280 160 L 270 180 Q 200 195 130 180 Z" fill="#475569"/>
  <!-- Pita Wrap -->
  <path d="M 115 150 Q 110 80 200 70 Q 290 80 285 150 Q 200 170 115 150 Z" fill="url(#pita)"/>
  <!-- Grill Toast Marks -->
  <line x1="145" y1="95" x2="175" y2="140" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <line x1="185" y1="90" x2="215" y2="135" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <line x1="225" y1="95" x2="255" y2="140" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <!-- Filling burst from top -->
  <path d="M 140 100 Q 200 70 260 100" fill="#78350f"/>
  <!-- Grilled Chicken chunks -->
  <rect x="155" y="80" width="18" height="12" rx="4" fill="#b45309" transform="rotate(-15 155 80)"/>
  <rect x="190" y="75" width="22" height="14" rx="4" fill="#92400e" transform="rotate(10 190 75)"/>
  <rect x="230" y="82" width="16" height="12" rx="4" fill="#b45309" transform="rotate(25 230 82)"/>
  <!-- French Fries sticks poking out -->
  <rect x="145" y="55" width="8" height="35" rx="2" fill="#facc15" transform="rotate(-20 145 55)"/>
  <rect x="245" y="58" width="8" height="32" rx="2" fill="#eab308" transform="rotate(15 245 58)"/>
  <!-- Veggies: Pickles, purple cabbage, tomatoes -->
  <ellipse cx="175" cy="85" rx="8" ry="4" fill="#15803d" transform="rotate(20 175 85)"/>
  <ellipse cx="225" cy="88" rx="8" ry="4" fill="#ef4444" transform="rotate(-15 225 88)"/>
  <ellipse cx="202" cy="78" rx="7" ry="3" fill="#a855f7"/>
  <!-- Garlic Toum / Tahini Sauce Drizzle -->
  <path d="M 150 90 Q 170 115 190 95 Q 215 120 235 95 Q 255 110 265 95" stroke="#fefce8" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
