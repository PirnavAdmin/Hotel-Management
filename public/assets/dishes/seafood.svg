<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_sea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="prawn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="fish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_sea)"/>
  <ellipse cx="200" cy="240" rx="140" ry="24" fill="#000000" opacity="0.6"/>
  <!-- Dark Serving Plate -->
  <ellipse cx="200" cy="180" rx="145" ry="50" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <ellipse cx="200" cy="178" rx="130" ry="42" fill="#0f172a"/>
  <!-- Crispy Fried Fish Fillet -->
  <path d="M 120 175 Q 190 140 270 165 Q 260 195 190 195 Q 130 195 120 175 Z" fill="url(#fish)"/>
  <!-- Crispy scored fry marks -->
  <line x1="160" y1="160" x2="175" y2="185" stroke="#451a03" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="190" y1="158" x2="205" y2="185" stroke="#451a03" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="220" y1="162" x2="235" y2="185" stroke="#451a03" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Tiger Prawns -->
  <path d="M 230 140 C 265 130 280 160 255 175 C 240 180 235 160 248 155" stroke="url(#prawn)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Lemon Wedges -->
  <path d="M 125 150 A 18 18 0 0 1 145 168 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <path d="M 265 180 A 18 18 0 0 1 285 198 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <!-- Herbs & Red Chillies -->
  <ellipse cx="185" cy="168" rx="8" ry="3.5" fill="#15803d" transform="rotate(-15 185 168)"/>
  <ellipse cx="215" cy="172" rx="7" ry="3" fill="#dc2626" transform="rotate(25 215 172)"/>
</svg>
