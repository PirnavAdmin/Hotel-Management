<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26120b"/>
      <stop offset="100%" stop-color="#0c0502"/>
    </linearGradient>
    <linearGradient id="tandoor_meat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg_tan)"/>
  <ellipse cx="200" cy="240" rx="140" ry="25" fill="#000000" opacity="0.6"/>
  <!-- Tandoori Skewer 1 -->
  <line x1="80" y1="210" x2="320" y2="90" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <!-- Skewer Kebab Chunks / Drumstick -->
  <rect x="130" y="155" width="40" height="30" rx="10" fill="url(#tandoor_meat)" transform="rotate(-26 130 155)"/>
  <line x1="125" y1="165" x2="155" y2="155" stroke="#431407" stroke-width="4" stroke-linecap="round"/>
  <rect x="180" y="130" width="45" height="32" rx="12" fill="url(#tandoor_meat)" transform="rotate(-26 180 130)"/>
  <line x1="175" y1="140" x2="205" y2="130" stroke="#431407" stroke-width="4" stroke-linecap="round"/>
  <rect x="235" y="105" width="42" height="30" rx="10" fill="url(#tandoor_meat)" transform="rotate(-26 235 105)"/>
  <line x1="230" y1="115" x2="260" y2="105" stroke="#431407" stroke-width="4" stroke-linecap="round"/>
  <!-- Bell pepper & onion slices on skewer -->
  <polygon points="120,175 130,165 125,185" fill="#15803d"/>
  <polygon points="170,150 180,140 175,160" fill="#facc15"/>
  <polygon points="225,125 235,115 230,135" fill="#dc2626"/>
  <!-- Charcoal char spots -->
  <circle cx="150" cy="168" r="4" fill="#18181b"/>
  <circle cx="198" cy="142" r="5" fill="#18181b"/>
  <circle cx="250" cy="116" r="4" fill="#18181b"/>
  <!-- Mint Chutney dip cup -->
  <ellipse cx="120" cy="225" rx="30" ry="14" fill="#166534"/>
  <ellipse cx="120" cy="222" rx="26" ry="11" fill="#22c55e"/>
  <!-- Flame Sparks -->
  <circle cx="270" cy="85" r="3" fill="#f59e0b"/>
  <circle cx="285" cy="75" r="2.5" fill="#ea580c"/>
  <circle cx="260" cy="65" r="2" fill="#ef4444"/>
</svg>
